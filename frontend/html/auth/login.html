<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="O Festival Experiência Viva reúne atividades culturais, artísticas e educativas para proporcionar experiências de aprendizado, criatividade e interação."
        />

        <link
            rel="shortcut icon"
            href="/frontend/img/icons/logo.png"
            type="image/x-icon"
        />
        <link rel="stylesheet" href="/frontend/css/global.css" />
        <link rel="stylesheet" href="/frontend/css/components.css" />

        <script type="module" src="/frontend/js/config/components.js"></script>
        <script type="module" src="/frontend/js/auth/login.js"></script>

        <title>Festival Experiência Viva</title>
    </head>
    <body>
        <header id="header"></header>
        <nav id="nav"></nav>

        <main>
            <h2>Entrar</h2>

            <section>
                <form action="" class="form" id="form">

                    <article class="form-item">
                        <label for="email">Email:</label>
                        <input
                            type="email"
                            name="email-input"
                            id="email"
                            autocomplete="off"
                            required
                        />
                    </article>

                    <article class="form-item">
                        <label for="password">Senha:</label>
                        <input
                            type="password"
                            name="password-input"
                            id="password"
                            autocomplete="off"
                            required
                        />
                    </article>

                    <span id="errorMessage"></span>
                    
                    <button type="submit" id="submitButton">Entrar</button>

                    <a href="/frontend/html/auth/register.html">Clique aqui para se cadastrar!</a> 
                </form>
            </section>
        </main>

        <footer id="footer"></footer>
    </body>
</html>
